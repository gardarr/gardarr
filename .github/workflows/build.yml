name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25.3'

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install CGO dependencies for SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Download dependencies
      working-directory: ./backend
      run: go mod download

    - name: Run backend tests
      working-directory: ./backend
      env:
        CGO_ENABLED: 1
      run: go test -v ./...

    - name: Run backend linter
      working-directory: ./backend
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        golangci-lint run

    - name: Build backend
      working-directory: ./backend
      env:
        CGO_ENABLED: 1
      run: |
        mkdir -p ../dist
        go build -o ../dist/gardarr-test .

  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: npx vitest run

    - name: Run frontend linter
      working-directory: ./frontend
      run: npm run lint

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    strategy:
      matrix:
        #os: [linux, windows, darwin]
        #arch: [amd64, arm64]
        os: [linux]
        arch: [amd64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Get version info
      id: version
      run: |
        # Get version from git tag or default
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
        else
          # For non-release builds, use commit count and short hash
          VERSION="0.0.0-dev+$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
        fi
        
        # Get commit hash
        COMMIT=$(git rev-parse HEAD)
        
        # Get build date
        DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT
        
        echo "Version: $VERSION"
        echo "Commit: $COMMIT"
        echo "Date: $DATE"

    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Copy frontend to backend
      run: |
        mkdir -p backend/web
        cp -r frontend/dist/* backend/web/

    - name: Install CGO dependencies for SQLite (Linux only)
      if: matrix.os == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Build binary
      working-directory: ./backend
      run: |
        # Set build variables
        export GOOS=${{ matrix.os }}
        export GOARCH=${{ matrix.arch }}
        # Enable CGO for Linux builds (required for SQLite), disable for other platforms
        if [ "${{ matrix.os }}" = "linux" ]; then
          export CGO_ENABLED=1
        else
          export CGO_ENABLED=0
        fi
        
        # Build with ldflags
        go build \
          -ldflags "-X github.com/gardarr/gardarr/pkg/version.Version=${{ steps.version.outputs.version }} \
                    -X github.com/gardarr/gardarr/pkg/version.Commit=${{ steps.version.outputs.commit }} \
                    -X github.com/gardarr/gardarr/pkg/version.Date=${{ steps.version.outputs.date }} \
                    -w -s" \
          -o ../dist/gardarr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
          .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gardarr-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/gardarr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
        retention-days: 30

  # Docker build is handled by docker-build.yml workflow for releases
