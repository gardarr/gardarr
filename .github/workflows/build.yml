name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25.3'

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install CGO dependencies for SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Download dependencies
      working-directory: ./backend
      run: go mod download

    - name: Run backend tests
      working-directory: ./backend
      env:
        CGO_ENABLED: 1
      run: |
        mkdir -p coverage
        go test -v -covermode=atomic -coverpkg=./... \
          -coverprofile=coverage/backend.out ./...

    - name: Upload backend coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-coverage
        path: backend/coverage/backend.out
        retention-days: 1

    - name: Run backend linter
      working-directory: ./backend
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        golangci-lint run

    - name: Build backend
      working-directory: ./backend
      env:
        CGO_ENABLED: 1
      run: |
        mkdir -p ../dist
        go build -o ../dist/gardarr-test .

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22.22.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test:coverage

    - name: Upload frontend coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: frontend-coverage
        path: frontend/coverage/lcov.info
        retention-days: 1

    - name: Run frontend linter
      working-directory: ./frontend
      run: npm run lint

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  codacy-coverage:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Download backend coverage report
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: backend-coverage
        path: coverage/backend

    - name: Download frontend coverage report
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: frontend-coverage
        path: coverage/frontend

    - name: Upload coverage to Codacy
      # Fork pull requests don't receive repository secrets, so this is skipped
      # until their changes are merged or tested from a branch in this repository.
      if: env.CODACY_PROJECT_TOKEN != ''
      run: |
        curl -Ls https://coverage.codacy.com/get.sh -o /tmp/codacy-coverage-reporter
        (
          cd backend
          bash /tmp/codacy-coverage-reporter report \
            --partial \
            --force-coverage-parser go \
            -r ../coverage/backend/backend.out
        )
        (
          cd frontend
          bash /tmp/codacy-coverage-reporter report \
            --partial \
            -l Javascript \
            -r ../coverage/frontend/lcov.info
        )
        bash /tmp/codacy-coverage-reporter final

  build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
    
    strategy:
      matrix:
        #os: [linux, windows, darwin]
        #arch: [amd64, arm64]
        os: [linux]
        arch: [amd64]

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Get version info
      id: version
      run: |
        # Get version from git tag or default
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
        else
          # For non-release builds, use commit count and short hash
          VERSION="0.0.0-dev+$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
        fi
        
        # Get commit hash
        COMMIT=$(git rev-parse HEAD)
        
        # Get build date
        DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT
        
        echo "Version: $VERSION"
        echo "Commit: $COMMIT"
        echo "Date: $DATE"

    - name: Download frontend artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Copy frontend to backend
      run: |
        mkdir -p backend/web
        cp -r frontend/dist/* backend/web/

    - name: Install CGO dependencies for SQLite (Linux only)
      if: matrix.os == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Build binary
      working-directory: ./backend
      run: |
        # Set build variables
        export GOOS=${{ matrix.os }}
        export GOARCH=${{ matrix.arch }}
        # Enable CGO for Linux builds (required for SQLite), disable for other platforms
        if [ "${{ matrix.os }}" = "linux" ]; then
          export CGO_ENABLED=1
        else
          export CGO_ENABLED=0
        fi
        
        # Build with ldflags
        go build \
          -ldflags "-X github.com/jfxdev/gardarr/pkg/version.Version=${{ steps.version.outputs.version }} \
                    -X github.com/jfxdev/gardarr/pkg/version.Commit=${{ steps.version.outputs.commit }} \
                    -X github.com/jfxdev/gardarr/pkg/version.Date=${{ steps.version.outputs.date }} \
                    -w -s" \
          -o ../dist/gardarr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
          .

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gardarr-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/gardarr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
        retention-days: 30

  # Docker build is handled by docker-build.yml workflow for releases
