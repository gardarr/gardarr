name: Build and Push Docker Image

on:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.10.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 3

  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            cc: ""
            output: gardarr-amd64
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            output: gardarr-arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Get version info
      id: version
      run: |
        # Get version from git tag or default
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
        else
          # For non-release builds, use commit count and short hash
          VERSION="0.0.0-dev+$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
        fi
        
        # Get commit hash
        COMMIT=$(git rev-parse HEAD)
        
        # Get build date
        DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT
        
        echo "Version: $VERSION"
        echo "Commit: $COMMIT"
        echo "Date: $DATE"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.goarch }}-
          ${{ runner.os }}-go-

    - name: Download Go dependencies
      working-directory: ./backend
      run: go mod download

    - name: Set up QEMU for cross-compilation
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      with:
        platforms: linux/amd64,linux/arm64

    - name: Build Go binary for ${{ matrix.arch }} using Alpine
      run: |
        # Create dist directory
        mkdir -p dist
        
        # Build using Alpine-based Go container to ensure musl libc compatibility
        # This ensures the binary will run on Alpine Linux in the final image
        docker run --rm --platform linux/${{ matrix.arch }} \
          -v "$(pwd)/backend:/src" \
          -v "$(pwd)/dist:/dist" \
          -w /src \
          golang:1.25.3-alpine \
          sh -c "
            # Install build dependencies for CGO
            apk add --no-cache gcc musl-dev sqlite-dev
            
            echo 'Building static binary for linux/${{ matrix.goarch }}...'
            CGO_ENABLED=1 \
            GOOS=linux \
            GOARCH=${{ matrix.goarch }} \
            go build \
              -ldflags='-X github.com/jfxdev/gardarr/pkg/version.Version=${{ steps.version.outputs.version }} \
                        -X github.com/jfxdev/gardarr/pkg/version.Commit=${{ steps.version.outputs.commit }} \
                        -X github.com/jfxdev/gardarr/pkg/version.Date=${{ steps.version.outputs.date }} \
                        -w -s -linkmode external -extldflags \"-static\"' \
              -tags 'osusergo netgo sqlite_omit_load_extension' \
              -o /dist/${{ matrix.output }} .
            
            # Verify the binary was built
            ls -lh /dist/${{ matrix.output }}
          "

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.arch }}
        path: dist/${{ matrix.output }}
        retention-days: 3

  build-and-push:
    needs: [build-frontend, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version info

    - name: Download binary artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        merge-multiple: true
        path: backend/dist

    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist

    - name: Verify binary artifacts
      run: |
        for arch in amd64 arm64; do
          binary="backend/dist/gardarr-$arch"
          if [ ! -f "$binary" ]; then
            echo "❌ Missing binary for $arch: $binary"
            exit 1
          fi
          echo "✅ Found binary: $binary"
        done

    - name: Verify frontend artifact
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "❌ Missing frontend dist directory"
          exit 1
        fi
        if [ ! -f "frontend/dist/index.html" ]; then
          echo "❌ Missing frontend/dist/index.html"
          exit 1
        fi
        echo "✅ Found frontend artifacts"
        ls -lh frontend/dist/
        
        # Debug: Verify structure
        echo "📁 Working directory: $(pwd)"
        echo "📁 Frontend dist contents:"
        find frontend/dist -type f | head -10

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64
        driver-opts: |
          image=moby/buildkit:buildx-stable-1

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          APP_PORT=3000
        provenance: true

    - name: Make package public
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Package published to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.tags }}"
        echo "Platforms: linux/amd64,linux/arm64"
        
        # Get the package name from the repository name
        PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
        
        # Check current package visibility
        echo "Checking package visibility..."
        PACKAGE_INFO=$(gh api \
          --method GET \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME 2>/dev/null || echo "")
        
        if [ -z "$PACKAGE_INFO" ]; then
          echo "⚠️  Package not found or inaccessible, skipping visibility update"
          exit 0
        fi
        
        VISIBILITY=$(echo "$PACKAGE_INFO" | jq -r '.visibility // "unknown"')
        echo "Current visibility: $VISIBILITY"
        
        if [ "$VISIBILITY" = "public" ]; then
          echo "✅ Package is already public, no action needed"
          exit 0
        fi
        
        # Make the package public using GitHub CLI
        echo "Making package public..."
        gh api \
          --method PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME \
          -f visibility=public || echo "⚠️  Failed to make package public automatically"
        
        echo "✅ Package visibility updated to public"
