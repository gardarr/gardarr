# Prometheus scrape configuration for Gardarr
#
# Edit the values below to match your environment:
#   - targets: host and port where Gardarr is running
#   - username / password: must match METRICS_USERNAME / METRICS_PASSWORD in Gardarr

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "gardarr"
    metrics_path: /metrics
    scheme: http

    static_configs:
      - targets:
          - "host.docker.internal:3200"
        labels:
          app: gardarr
          env: development