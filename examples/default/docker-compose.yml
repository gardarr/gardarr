services:
  gardarr:
    image: ghcr.io/jfxdev/gardarr:latest
    container_name: gardarr
    # Run as host user to ensure proper filesystem permissions
    # Use: user: "1000:1000" or user: "${UID}:${GID}" in .env file
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-3200}:3200"
    environment:
      APP_PORT: ${APP_PORT:-3200}
      # APP_URL should be origin-only: http://example.com or http://localhost:3200 (no trailing slash or path)
      APP_URL: ${APP_URL:-http://gardarr.mydomain.com}
      APP_MODE: standalone
      STATISTICS_ENABLED: true
      STATISTICS_INTERVAL: 5s
      STATISTICS_DIR: /data/statistics
    volumes:
      # Use /data to persist SQLite database
      - gardarr_data:/data
      # Use /media to persist images and media files
      - gardarr_media:/media
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gardarr-agent:
    image: ghcr.io/jfxdev/gardarr:latest
    container_name: gardarr-agent
    # Run as host user to ensure proper filesystem permissions
    user: "${UID:-1000}:${GID:-1000}"
    command: ["/app/main", "agent"]
    ports:
      - "${AGENT_PORT:-3100}:3100"
    environment:
      AGENT_PORT: ${AGENT_PORT:-3100}
      AGENT_SECRET: ${AGENT_SECRET}
      # Replace the following placeholder values with your actual qBittorrent credentials
      QBITTORRENT_BASEURL: "${QBITTORRENT_BASEURL}"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}"
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  gardarr_data:
    driver: local

networks:
  gardarr-network:
    driver: bridge
