services:
  gardarr-worker:
    image: ghcr.io/jfxdev/gardarr:latest
    container_name: gardarr-worker
    command: ["./main", "worker"]
    ports:
      - "${WORKER_PORT:-3100}:3100"
    environment:
      WORKER_PORT: ${WORKER_PORT:-3100}
      # Generate a random secret for the worker
      WORKER_SECRET: ${WORKER_SECRET}
      # Replace the following placeholder values with your actual qBittorrent credentials
      QBITTORRENT_URL: "${QBITTORRENT_URL}"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}"
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  gardarr-network:
    driver: bridge