services:
  gardarr:
    image: ghcr.io/jfxdev/gardarr:latest
    container_name: gardarr
    # Run as host user to ensure proper filesystem permissions
    # Use: user: "1000:1000" or user: "${UID}:${GID}" in .env file
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-3200}:3200"
    environment:
      APP_PORT: ${APP_PORT:-3200}
      # APP_URL should be origin-only: http://example.com or http://localhost:3200 (no trailing slash or path)
      APP_URL: ${APP_URL:-http://gardarr.mydomain.com}
    volumes:
      # Use /data if you're using SQLite for database
      - gardarr_data:/data
      # Use /media to store images and media files
      - gardarr_media:/media
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # PostgreSQL container example
  postgres:
    image: postgres:15-alpine
    container_name: gardarr-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-seedbox}
      - POSTGRES_USER=${POSTGRES_USER:-seedbox}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-seedbox123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - gardarr-network

volumes:
  gardarr_data:
    driver: local
  postgres_data:
    driver: local

networks:
  gardarr-network:
    driver: bridge
