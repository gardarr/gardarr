services:
  gardarr:
    image: ghcr.io/gardarr/gardarr:latest
    container_name: gardarr
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_PORT: ${APP_PORT:-3000}
      APP_DOMAINS: ${APP_DOMAINS:-http://localhost:3000,http://localhost:5173}
      APP_MODE: standalone
      STATISTICS_ENABLED: true
      STATISTICS_INTERVAL: 5s
      STATISTICS_DIR: /data/statistics
    volumes:
      - gardarr_data:/data
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Exemplo de serviço de banco de dados (descomente se necessário)
  postgres:
    image: postgres:15-alpine
    container_name: gardarr-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-seedbox}
      - POSTGRES_USER=${POSTGRES_USER:-seedbox}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-seedbox123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - gardarr-network

volumes:
  gardarr_data:
    driver: local
  postgres_data:
    driver: local

networks:
  gardarr-network:
    driver: bridge
