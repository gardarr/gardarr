services:
  gardarr:
    image: gardarr:local
    container_name: gardarr
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_PORT: ${APP_PORT:-3000}
      APP_DOMAINS: ${APP_DOMAINS:-http://localhost:3000,http://localhost:5173}
      APP_MODE: standalone
      STATISTICS_ENABLED: true
      STATISTICS_INTERVAL: 5s
      STATISTICS_DIR: /data/statistics
      QBITTORRENT_BASEURL: "your-qbittorrent-baseurl"
      QBITTORRENT_USERNAME: "your-qbittorrent-username"
      QBITTORRENT_PASSWORD: "your-qbittorrent-password"
    volumes:
      - gardarr_data:/data
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  gardarr_data:
    driver: local

networks:
  gardarr-network:
    driver: bridge
