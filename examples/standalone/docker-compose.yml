services:
  gardarr:
    image: ghcr.io/jfxdev/gardarr:latest
    container_name: gardarr
    # Run as host user for bind mounts (Option 1)
    # For named volumes (Option 2), comment out or remove this line
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-3200}:3200"
    environment:
      APP_PORT: ${APP_PORT:-3200}
      # APP_URL should be origin-only: http://example.com or http://localhost:3200 (no trailing slash or path)
      APP_URL: ${APP_URL:-http://gardarr.mydomain.com}
      APP_MODE: standalone
      STATISTICS_ENABLED: true
      STATISTICS_INTERVAL: 5s
      STATISTICS_DIR: /data/statistics
      # Replace the following placeholder values with your actual qBittorrent credentials
      QBITTORRENT_URL: "${QBITTORRENT_URL}"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}"
    volumes:
      # Option 1: Bind mounts (recommended for user permission control)
      # Create directories first: mkdir -p ./data ./media
      - ./data:/data
      - ./media:/media
      # Option 2: Named volumes (uncomment below and comment out bind mounts above)
      # Note: When using named volumes, omit 'user:' directive or use root
      # - gardarr_data:/data
      # - gardarr_media:/media
    restart: unless-stopped
    networks:
      - gardarr-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Uncomment if using named volumes (Option 2)
# volumes:
#   gardarr_data:
#     driver: local
#   gardarr_media:
#     driver: local

networks:
  gardarr-network:
    driver: bridge
